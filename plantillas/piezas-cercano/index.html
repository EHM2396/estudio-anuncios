<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/comun.js"></script>
    <style>
      /* Dirección cercano: cálida y humana. Redondeada, notas a mano con flechas, burbujas de chat,
         manchas orgánicas y el teléfono con marco del color de la marca. */
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-500.ttf"); font-weight: 500; }
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-600.ttf"); font-weight: 600; }
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-700.ttf"); font-weight: 700; }
      @font-face { font-family: "Titular"; src: url("assets/fuentes/Fredoka-Variable.ttf"); font-weight: 300 700; font-stretch: 75% 125%; }
      @font-face { font-family: "Mano"; src: url("assets/fuentes/Caveat-Variable.ttf"); font-weight: 400 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #fff8ee; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Marca", sans-serif;
        --crema: color-mix(in srgb, var(--colorClaro) 50%, #fff6ea);
        --tinta: var(--colorFondo2);
        --hondo: var(--colorFondo);
        --gris: color-mix(in srgb, var(--colorFondo2) 68%, #fff);
        --sombra-acento: color-mix(in srgb, var(--colorAcento) 70%, #000);
        --pad-y: 80px;
        --pad-x: 110px;
        --pad-abajo: 80px;
        --tel-w: 480px;
      }
      #root[data-formato="vertical"] { --pad-y: 220px; --pad-x: 76px; --pad-abajo: 320px; --tel-w: 520px; }
      #root[data-formato="4x5"] { --pad-y: 64px; --pad-x: 64px; --pad-abajo: 60px; --tel-w: 360px; }

      /* ---------- Página con manchas ---------- */
      .pieza {
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: var(--pad-y) var(--pad-x) var(--pad-abajo);
        background: var(--crema);
        color: var(--tinta);
      }
      .mancha { position: absolute; border-radius: 62% 38% 54% 46% / 47% 58% 42% 53%; pointer-events: none; }
      .mancha.a { background: color-mix(in srgb, var(--colorAcento) 32%, transparent); }
      .mancha.b { background: color-mix(in srgb, var(--colorFondo) 10%, transparent); border-radius: 41% 59% 37% 63% / 58% 41% 59% 42%; }
      .cab { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
      .logo { display: block; width: 340px; height: 68px; object-fit: contain; object-position: left center; }
      .cuerpo { position: relative; z-index: 2; display: grid; min-height: 0; padding: 36px 0; gap: 60px; }
      .texto { display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
      .titulo { font-family: "Titular", sans-serif; font-weight: 600; line-height: 1.04; letter-spacing: -0.01em; color: var(--hondo); text-wrap: balance; }
      /* resaltado como marcador: una franja de color torcida detrás de la parte de abajo */
      .titulo .resaltado {
        background: linear-gradient(176deg, transparent 52%, color-mix(in srgb, var(--colorAcento) 60%, transparent) 54% 90%, transparent 92%);
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
        padding: 0 0.06em;
      }
      .sub { font-size: 34px; font-weight: 500; line-height: 1.42; color: var(--gris); text-wrap: pretty; max-width: 880px; }
      .mano { font-family: "Mano", cursive; font-weight: 700; color: var(--hondo); line-height: 1; }
      .etiqueta {
        align-self: flex-start;
        padding: 10px 24px;
        border-radius: 999px;
        font-family: "Titular", sans-serif;
        font-weight: 600;
        font-size: 26px;
        background: #fff;
        color: var(--hondo);
        box-shadow: 0 6px 0 color-mix(in srgb, var(--colorFondo) 14%, transparent);
      }

      /* Teléfono con marco del color de la marca */
      .zona-tel { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
      .tel {
        position: relative;
        /* alto de la zona, salvo que a lo ancho no quepa: entonces se achica entero (nunca se recorta la captura) */
        height: min(100%, calc(var(--tel-w) / var(--ar-tel, 0.58)));
        aspect-ratio: var(--ar-tel, 0.58);
        padding: 16px;
        border-radius: 72px;
        background: var(--hondo);
        box-shadow: 0 30px 70px -20px color-mix(in srgb, var(--colorFondo) 55%, transparent);
        transform: rotate(4deg);
      }
      .tel.izq { transform: rotate(-4deg); }
      .tel .pantalla { width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: #fff; }
      .tel img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
      /* nota escrita a mano con flecha dibujada */
      .nota {
        position: absolute;
        z-index: 3;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 18px 28px 22px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 8px 0 color-mix(in srgb, var(--colorFondo) 14%, transparent);
        font-size: 48px;
        transform: rotate(-5deg);
        white-space: nowrap;
      }
      .nota b { font-family: "Titular", sans-serif; font-weight: 700; font-size: 0.9em; color: var(--tinta); background: linear-gradient(176deg, transparent 55%, color-mix(in srgb, var(--colorAcento) 60%, transparent) 57% 92%, transparent 94%); align-self: flex-start; padding: 0 0.1em; }
      .nota svg { position: absolute; width: 170px; height: 110px; color: var(--hondo); }

      /* ---------- Pie ---------- */
      .pie { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 30px; }
      .pie-fila { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        height: 84px;
        padding: 0 42px;
        border-radius: 999px;
        font-family: "Titular", sans-serif;
        font-size: 34px;
        font-weight: 600;
        background: var(--colorAcento);
        color: var(--colorSobreAcento);
        box-shadow: 0 8px 0 var(--sombra-acento);
      }
      .cta svg { width: 30px; height: 30px; }
      .insignia { height: 66px; display: block; }
      .insignia-web { height: 66px; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 16px; border-radius: 18px; background: #fff; color: var(--tinta); box-shadow: 0 6px 0 color-mix(in srgb, var(--colorFondo) 14%, transparent); }
      .insignia-web svg { width: 36px; height: 36px; color: var(--hondo); }
      .insignia-web small { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.1; color: var(--gris); }
      .insignia-web b { display: block; font-size: 27px; font-weight: 600; line-height: 1.05; }
      .url { font-family: "Titular", sans-serif; font-size: 26px; font-weight: 500; color: var(--gris); }

      /* ---------- 1. Pregunta: dentro de una burbuja de chat ---------- */
      #p-pregunta .texto { gap: 30px; }
      #p-pregunta .burbuja {
        position: relative;
        align-self: flex-start;
        max-width: 1500px;
        padding: 50px 64px 56px;
        border-radius: 64px 64px 64px 18px;
        background: #fff;
        box-shadow: 0 12px 0 color-mix(in srgb, var(--colorFondo) 12%, transparent);
        overflow: hidden;
      }
      #p-pregunta .titulo { font-size: 128px; }
      #p-pregunta .escribiendo { align-self: flex-start; display: flex; gap: 12px; padding: 24px 30px; margin-left: 40px; border-radius: 40px 40px 40px 12px; background: var(--colorAcento); }
      #p-pregunta .escribiendo i { width: 18px; height: 18px; border-radius: 50%; background: var(--colorSobreAcento); }
      #p-pregunta .escribiendo i:nth-child(2) { opacity: 0.7; }
      #p-pregunta .escribiendo i:nth-child(3) { opacity: 0.4; }
      #p-pregunta .sub { margin-left: 8px; }

      /* ---------- 2. Beneficio: texto + teléfono con nota a mano ---------- */
      #p-beneficio .cuerpo { grid-template-columns: 1fr 0.85fr; }
      #p-beneficio .texto { gap: 30px; }
      #p-beneficio .titulo { font-size: 104px; }
      #p-beneficio .nota { left: -60px; bottom: 10%; }
      #p-beneficio .nota svg { left: 60%; top: -96px; transform: rotate(-4deg); }

      /* ---------- 3. Número: la cifra dentro de una mancha ---------- */
      #p-numero .cuerpo { grid-template-columns: 0.9fr 1.1fr; align-items: center; }
      #p-numero .texto { gap: 26px; }
      #p-numero .texto .mano { font-size: 74px; }
      #p-numero .sub { font-size: 38px; }
      #p-numero .globo {
        position: relative;
        display: grid;
        place-items: center;
        height: 100%;
        max-height: 720px;
        padding: 0 70px;
        border-radius: 52% 48% 45% 55% / 55% 45% 55% 45%;
        background: var(--colorAcento);
        color: var(--colorSobreAcento);
        box-shadow: 0 16px 0 var(--sombra-acento);
        transform: rotate(-3deg);
        overflow: hidden;
      }
      #p-numero .valor { font-family: "Titular", sans-serif; font-weight: 700; font-size: 280px; line-height: 1; letter-spacing: -0.02em; white-space: nowrap; }
      #p-numero .flecha-mano { position: absolute; left: 34%; top: 2%; width: 200px; height: 130px; color: var(--hondo); transform: rotate(8deg); }

      /* ---------- 4. Lista: tarjetas con checks a mano + teléfono ---------- */
      #p-lista .cuerpo { grid-template-columns: 0.75fr 1fr; }
      #p-lista .zona-tel { order: -1; }
      #p-lista .texto { gap: 36px; }
      #p-lista .titulo { font-size: 92px; }
      #p-lista ul { list-style: none; display: flex; flex-direction: column; gap: 20px; font-size: 38px; }
      #p-lista li { align-self: flex-start; display: flex; align-items: center; gap: 18px; padding: 18px 32px 18px 20px; border-radius: 26px; background: #fff; font-weight: 600; box-shadow: 0 6px 0 color-mix(in srgb, var(--colorFondo) 12%, transparent); }
      #p-lista li:nth-child(1) { transform: rotate(-1.2deg); }
      #p-lista li:nth-child(2) { transform: rotate(0.9deg); margin-left: 30px; }
      #p-lista li:nth-child(3) { transform: rotate(-0.5deg); margin-left: 10px; }
      #p-lista li svg, #p-antes li svg { width: 1.2em; height: 1.2em; flex: none; color: var(--hondo); }

      /* ---------- 5. Antes / después: dos tarjetas y una flecha a mano ---------- */
      #p-antes .cuerpo { grid-template-columns: 1fr 220px 1fr; align-items: center; gap: 0; }
      #p-antes .tarjeta { display: flex; flex-direction: column; gap: 28px; padding: 50px 56px; border-radius: 48px; min-height: 0; }
      #p-antes .antes { background: color-mix(in srgb, var(--tinta) 7%, var(--crema)); transform: rotate(-1.5deg); }
      #p-antes .despues { background: #fff; border: 5px solid var(--colorAcento); box-shadow: 0 12px 0 color-mix(in srgb, var(--colorAcento) 45%, transparent); transform: rotate(1.2deg); }
      #p-antes h2 { font-family: "Titular", sans-serif; font-weight: 600; font-size: 52px; color: var(--hondo); }
      #p-antes .antes h2 { color: var(--gris); }
      #p-antes ul { list-style: none; display: flex; flex-direction: column; gap: 20px; font-size: 38px; }
      #p-antes li { display: flex; align-items: center; gap: 16px; font-weight: 600; line-height: 1.15; }
      #p-antes .antes li { color: var(--gris); }
      #p-antes .antes li svg { color: color-mix(in srgb, var(--gris) 70%, transparent); }
      #p-antes .flecha-mano { width: 200px; height: 120px; justify-self: center; color: var(--hondo); }

      /* ---------- Vertical ---------- */
      [data-formato="vertical"] .pie { flex-direction: column; align-items: flex-start; gap: 18px; }
      [data-formato="vertical"] #p-pregunta .titulo { font-size: 116px; }
      [data-formato="vertical"] #p-pregunta .burbuja { padding: 44px 50px 50px; }
      [data-formato="vertical"] #p-beneficio .cuerpo,
      [data-formato="vertical"] #p-lista .cuerpo { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 40px; }
      [data-formato="vertical"] #p-lista .zona-tel { order: 0; }
      [data-formato="vertical"] #p-beneficio .titulo { font-size: 96px; }
      [data-formato="vertical"] #p-beneficio .nota { left: 0; bottom: 12%; }
      [data-formato="vertical"] #p-numero .cuerpo { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      [data-formato="vertical"] #p-numero .globo { max-height: 640px; }
      [data-formato="vertical"] #p-numero .flecha-mano { display: none; }
      [data-formato="vertical"] #p-numero .valor { font-size: 230px; }
      [data-formato="vertical"] #p-lista .titulo { font-size: 84px; }
      [data-formato="vertical"] #p-antes .cuerpo { grid-template-columns: 1fr; grid-template-rows: 1fr 150px 1fr; }
      [data-formato="vertical"] #p-antes .flecha-mano { transform: rotate(90deg); }

      /* ---------- 4:5 ---------- */
      [data-formato="4x5"] .logo { width: 280px; height: 56px; }
      [data-formato="4x5"] .cuerpo { padding: 28px 0; gap: 34px; }
      [data-formato="4x5"] .sub { font-size: 27px; }
      [data-formato="4x5"] .etiqueta { font-size: 20px; padding: 8px 18px; }
      [data-formato="4x5"] .cta { height: 68px; padding: 0 32px; font-size: 27px; box-shadow: 0 6px 0 var(--sombra-acento); }
      [data-formato="4x5"] .insignia, [data-formato="4x5"] .insignia-web { height: 56px; }
      [data-formato="4x5"] .insignia-web b { font-size: 22px; }
      [data-formato="4x5"] .url { font-size: 21px; }
      [data-formato="4x5"] .pie { flex-direction: column; align-items: flex-start; gap: 14px; }
      [data-formato="4x5"] .nota { font-size: 38px; }
      [data-formato="4x5"] .nota svg { width: 120px; height: 80px; }
      [data-formato="4x5"] #p-pregunta .titulo { font-size: 92px; }
      [data-formato="4x5"] #p-pregunta .burbuja { padding: 34px 40px 40px; border-radius: 44px 44px 44px 14px; }
      [data-formato="4x5"] #p-beneficio .titulo { font-size: 66px; }
      [data-formato="4x5"] #p-beneficio .nota { left: -70px; }
      [data-formato="4x5"] #p-numero .cuerpo { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 26px; }
      [data-formato="4x5"] #p-numero .texto .mano { font-size: 54px; }
      [data-formato="4x5"] #p-numero .sub { font-size: 29px; }
      [data-formato="4x5"] #p-numero .valor { font-size: 190px; }
      [data-formato="4x5"] #p-numero .flecha-mano { display: none; }
      [data-formato="4x5"] #p-lista .titulo { font-size: 58px; }
      [data-formato="4x5"] #p-lista ul { font-size: 27px; gap: 12px; }
      [data-formato="4x5"] #p-lista li { padding: 12px 22px 12px 14px; }
      [data-formato="4x5"] #p-antes .cuerpo { grid-template-columns: 1fr; grid-template-rows: 1fr 90px 1fr; }
      [data-formato="4x5"] #p-antes .tarjeta { padding: 28px 36px; gap: 16px; border-radius: 34px; }
      [data-formato="4x5"] #p-antes h2 { font-size: 38px; }
      [data-formato="4x5"] #p-antes ul { font-size: 28px; gap: 10px; }
      [data-formato="4x5"] #p-antes .flecha-mano { width: 130px; height: 80px; transform: rotate(90deg); }
    </style>
  </head>
  <body>
    <!-- Cada pieza ocupa 1 s de la línea de tiempo; el script saca una imagen de cada una -->
    <div id="root" data-formato="horizontal" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="p-pregunta" class="clip pieza" data-start="0" data-duration="1" data-track-index="0">
        <div class="mancha a" style="right: -180px; top: -160px; width: 760px; height: 700px"></div>
        <div class="mancha b" style="left: -200px; bottom: -260px; width: 820px; height: 640px"></div>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /></header>
        <div class="cuerpo">
          <div class="texto">
            <div class="burbuja"><h1 class="titulo" id="preguntaTitulo" data-ajustar data-caja=".texto"></h1></div>
            <div class="escribiendo"><i></i><i></i><i></i></div>
            <p class="sub" id="preguntaSub"></p>
          </div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-beneficio" class="clip pieza" data-start="1" data-duration="1" data-track-index="0">
        <div class="mancha a" style="right: 4%; top: 12%; width: 760px; height: 760px"></div>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /></header>
        <div class="cuerpo">
          <div class="texto">
            <span class="etiqueta" id="beneficioKicker"></span>
            <h1 class="titulo" id="beneficioTitulo" data-ajustar data-caja=".texto"></h1>
            <p class="sub" id="beneficioSub"></p>
          </div>
          <div class="zona-tel">
            <div class="tel"><div class="pantalla"><img src="{{img:@beneficio}}" alt="" /></div></div>
            <div class="nota mano" id="beneficioNota"></div>
          </div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-numero" class="clip pieza" data-start="2" data-duration="1" data-track-index="0">
        <div class="mancha b" style="left: -160px; top: -200px; width: 700px; height: 620px"></div>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /></header>
        <div class="cuerpo">
          <div class="texto">
            <span class="mano" id="numeroEtiqueta"></span>
            <p class="sub" id="numeroSub"></p>
          </div>
          <div class="globo"><span class="valor" id="numeroValor" data-ajustar data-caja=".globo"></span></div>
          <svg class="flecha-mano" viewBox="0 0 200 130" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 30 C 60 6, 130 10, 170 80" /><path d="M146 70 L172 86 L178 56" /></svg>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-lista" class="clip pieza" data-start="3" data-duration="1" data-track-index="0">
        <div class="mancha a" style="left: -6%; top: 14%; width: 720px; height: 740px"></div>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /></header>
        <div class="cuerpo">
          <div class="texto">
            <h1 class="titulo" id="listaTitulo" data-ajustar data-caja=".texto"></h1>
            <ul id="listaItems"></ul>
          </div>
          <div class="zona-tel"><div class="tel izq"><div class="pantalla"><img src="{{img:@lista}}" alt="" /></div></div></div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-antes" class="clip pieza" data-start="4" data-duration="1" data-track-index="0">
        <div class="mancha a" style="right: -140px; bottom: -180px; width: 760px; height: 640px"></div>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /></header>
        <div class="cuerpo">
          <div class="tarjeta antes"><h2 id="antesTitulo"></h2><ul id="antesItems"></ul></div>
          <svg class="flecha-mano" viewBox="0 0 200 120" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 70 C 50 20, 120 20, 178 62" /><path d="M152 66 L180 64 L170 38" /></svg>
          <div class="tarjeta despues"><h2 id="despuesTitulo"></h2><ul id="despuesItems"></ul></div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>
    </div>

    <script>
      // El script anunciar.mjs reemplaza este objeto con los datos de la marca
      const D = "__DATOS__";
      // trazos a mano: un check y una equis algo irregulares
      const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.8c1.6 1.4 3.4 3.5 5.6 6.2C12.2 12.6 16.4 7.4 21 3.6"/></svg>';
      const EQUIS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5.5c4.6 4.2 9.2 8.6 14 13.4M18.6 5c-4.4 4.4-8.6 9-13.2 14"/></svg>';
      const FLECHA = '<svg viewBox="0 0 170 110" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 100 C 40 40, 90 18, 150 22"/><path d="M128 8 L152 22 L130 40"/></svg>';
      armarPiezas(() => {
        const I = D.imagenes;

        $("preguntaTitulo").innerHTML = resaltar(I.pregunta.titulo, I.pregunta.resaltado);
        $("preguntaSub").textContent = I.pregunta.subtitulo;

        const b = I.beneficio;
        $("beneficioKicker").textContent = b.kicker;
        $("beneficioTitulo").textContent = b.titulo;
        $("beneficioSub").textContent = b.subtitulo;
        if (b.tarjeta) $("beneficioNota").innerHTML = `${FLECHA}<span>${esc(b.tarjeta.etiqueta)}</span><b>${esc(b.tarjeta.valor)}</b>`;
        else $("beneficioNota").remove();

        $("numeroEtiqueta").textContent = I.numero.etiqueta;
        $("numeroValor").textContent = I.numero.valor;
        $("numeroSub").textContent = I.numero.subtitulo;

        $("listaTitulo").innerHTML = esc(I.lista.titulo);
        $("listaItems").innerHTML = I.lista.items.map((t) => `<li>${CHECK}<span>${esc(t)}</span></li>`).join("");

        const a = I["antes-despues"];
        $("antesTitulo").textContent = a.antesTitulo;
        $("despuesTitulo").textContent = a.despuesTitulo;
        $("antesItems").innerHTML = a.antes.map((t) => `<li>${EQUIS}<span>${esc(t)}</span></li>`).join("");
        $("despuesItems").innerHTML = a.despues.map((t) => `<li>${CHECK}<span>${esc(t)}</span></li>`).join("");
      }).then(() => {
        window.__timelines["main"] = gsap.timeline({ paused: true });
      });
    </script>
  </body>
</html>
