<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/comun.js"></script>
    <style>
      /* Dirección datos: estilo suizo. Retícula visible, grotesca apretada, etiquetas en mono,
         el teléfono en línea con anotaciones y comparaciones como tabla. */
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-500.ttf"); font-weight: 500; }
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-600.ttf"); font-weight: 600; }
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-700.ttf"); font-weight: 700; }
      @font-face { font-family: "Titular"; src: url("assets/fuentes/SpaceGrotesk-Variable.ttf"); font-weight: 300 700; }
      @font-face { font-family: "Mono"; src: url("assets/fuentes/JetBrainsMono-Variable.ttf"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Marca", sans-serif;
        --pad-y: 84px;
        --pad-x: 110px;
        --pad-abajo: 84px;
        --tel-w: 470px;
      }
      #root[data-formato="vertical"] { --pad-y: 220px; --pad-x: 76px; --pad-abajo: 320px; --tel-w: 500px; }
      #root[data-formato="4x5"] { --pad-y: 68px; --pad-x: 68px; --pad-abajo: 64px; --tel-w: 360px; }

      /* ---------- Página con retícula de 12 columnas ---------- */
      .pieza {
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: var(--pad-y) var(--pad-x) var(--pad-abajo);
        --fondo: color-mix(in srgb, var(--colorClaro) 25%, #fff);
        --tinta: var(--colorFondo2);
        --gris: color-mix(in srgb, var(--colorFondo2) 55%, #fff);
        --linea: color-mix(in srgb, var(--colorFondo2) 9%, transparent);
        --linea-fuerte: var(--colorFondo2);
        background: var(--fondo);
        color: var(--tinta);
      }
      .pieza.tinta {
        --fondo: var(--colorFondo2);
        --tinta: #fff;
        --gris: color-mix(in srgb, #fff 62%, var(--colorFondo2));
        --linea: rgba(255, 255, 255, 0.08);
        --linea-fuerte: rgba(255, 255, 255, 0.85);
      }
      .pieza::before {
        content: "";
        position: absolute;
        inset: 0 var(--pad-x);
        background: repeating-linear-gradient(to right, var(--linea) 0 1.5px, transparent 1.5px calc((100% - 1.5px) / 12));
        border-right: 1.5px solid var(--linea);
        pointer-events: none;
      }
      /* marcas de registro en las esquinas */
      .registro { position: absolute; width: 36px; height: 36px; color: var(--gris); }
      .registro::before, .registro::after { content: ""; position: absolute; background: currentColor; }
      .registro::before { left: 50%; top: 0; bottom: 0; width: 1.5px; }
      .registro::after { top: 50%; left: 0; right: 0; height: 1.5px; }
      .registro.ai { left: calc(var(--pad-x) - 18px); top: calc(var(--pad-y) * 0.45); }
      .registro.ad { right: calc(var(--pad-x) - 18px); top: calc(var(--pad-y) * 0.45); }
      .cab { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 30px; }
      .logo { display: block; width: 360px; height: 76px; object-fit: contain; object-position: left center; }
      .mono { font-family: "Mono", monospace; font-weight: 500; font-size: 21px; letter-spacing: 0.02em; text-transform: uppercase; }
      .meta { color: var(--gris); text-align: right; }
      .cuerpo { position: relative; display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; min-height: 0; padding: 44px 0; }
      .texto { display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
      .titulo { font-family: "Titular", sans-serif; font-weight: 700; line-height: 0.96; letter-spacing: -0.045em; text-wrap: balance; }
      .titulo .resaltado { background: linear-gradient(transparent 16%, var(--colorAcento) 16% 97%, transparent 97%); color: var(--colorSobreAcento); padding: 0 0.08em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
      .sub { font-size: 32px; font-weight: 500; line-height: 1.38; color: var(--gris); text-wrap: pretty; }
      .rotulo { display: flex; align-items: center; gap: 14px; }
      .rotulo::before { content: ""; width: 18px; height: 18px; background: var(--colorAcento); flex: none; }

      /* Teléfono dibujado en línea, sin sombra, con una anotación */
      .tel { position: relative; width: var(--tel-w); aspect-ratio: var(--ar-tel, 0.58); padding: 12px; border: 2.5px solid var(--linea-fuerte); border-radius: 58px; background: var(--fondo); }
      .tel .pantalla { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; background: #fff; }
      .tel img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
      .zona-tel { position: relative; display: flex; align-items: center; justify-content: flex-end; min-height: 0; }
      /* alto de la zona, salvo que a lo ancho no quepa: entonces se achica entero (nunca se recorta la captura) */
      .zona-tel .tel { height: min(100%, calc(var(--tel-w) / var(--ar-tel, 0.58))); width: auto; }
      .nota { position: absolute; display: flex; align-items: center; gap: 0; white-space: nowrap; }
      .nota .linea { width: 120px; height: 2px; background: var(--linea-fuerte); position: relative; }
      .nota .linea::after { content: ""; position: absolute; right: -7px; top: -6px; width: 14px; height: 14px; border-radius: 50%; background: var(--colorAcento); border: 2px solid var(--linea-fuerte); }
      .nota .caja { padding: 18px 24px; border: 2px solid var(--linea-fuerte); background: var(--fondo); }
      .nota small { display: block; color: var(--gris); }
      .nota strong { display: block; font-family: "Titular", sans-serif; font-weight: 700; font-size: 52px; letter-spacing: -0.03em; line-height: 1.05; }

      /* ---------- Pie ---------- */
      .pie { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; }
      .pie-fila { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
      .cta { display: inline-flex; align-items: center; gap: 16px; height: 80px; padding: 0 34px 0 26px; font-family: "Titular", sans-serif; font-weight: 600; font-size: 32px; letter-spacing: -0.01em; background: var(--tinta); color: var(--fondo); }
      .cta::before { content: ""; width: 16px; height: 16px; background: var(--colorAcento); }
      .tinta .cta { background: var(--colorAcento); color: var(--colorSobreAcento); }
      .tinta .cta::before { background: var(--colorSobreAcento); }
      .cta svg { width: 28px; height: 28px; }
      .insignia { height: 64px; display: block; }
      .insignia-web { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 16px; border: 2px solid var(--linea-fuerte); }
      .insignia-web svg { width: 34px; height: 34px; }
      .insignia-web small { display: block; font-family: "Mono", monospace; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2; }
      .insignia-web b { display: block; font-size: 26px; font-weight: 600; line-height: 1.05; }
      .url { font-family: "Mono", monospace; font-size: 21px; font-weight: 500; text-transform: uppercase; color: var(--gris); }

      /* ---------- 1. Pregunta: titular asimétrico, subtítulo en la columna de la derecha ---------- */
      #p-pregunta .texto { grid-column: 1 / 11; justify-content: flex-start; padding-top: 10px; }
      #p-pregunta .titulo { font-size: 176px; }
      #p-pregunta .lado { grid-column: 8 / 13; align-self: end; display: flex; flex-direction: column; gap: 18px; padding-top: 30px; border-top: 2.5px solid var(--linea-fuerte); }
      #p-pregunta .cuerpo { grid-template-rows: 1fr auto; row-gap: 40px; }

      /* ---------- 2. Beneficio: texto a la izquierda, teléfono con anotación ---------- */
      #p-beneficio .texto { grid-column: 1 / 7; gap: 28px; }
      #p-beneficio .titulo { font-size: 104px; }
      #p-beneficio .zona-tel { grid-column: 7 / 13; }
      #p-beneficio .nota { right: calc(var(--tel-w) * 0.82); bottom: 16%; flex-direction: row; }

      /* ---------- 3. Número: cifra con cota técnica, página en tinta ---------- */
      #p-numero .texto { grid-column: 1 / 9; }
      #p-numero .cota { display: grid; grid-template-columns: 2px 1fr auto 1fr 2px; align-items: center; gap: 16px; color: var(--gris); margin-bottom: 22px; }
      #p-numero .cota i { height: 34px; background: var(--linea-fuerte); }
      #p-numero .cota b { height: 2px; background: var(--linea-fuerte); }
      #p-numero .cota span { color: var(--colorAcento); }
      #p-numero .valor { align-self: flex-start; font-family: "Titular", sans-serif; font-weight: 700; font-size: 300px; line-height: 0.88; letter-spacing: -0.06em; white-space: nowrap; }
      #p-numero .sub { margin-top: 34px; max-width: 760px; }
      #p-numero .zona-tel { grid-column: 9 / 13; }

      /* ---------- 4. Lista: tabla numerada ---------- */
      #p-lista .texto { grid-column: 1 / 8; gap: 40px; }
      #p-lista .titulo { font-size: 96px; }
      #p-lista ol { list-style: none; border-top: 2.5px solid var(--linea-fuerte); font-size: 46px; }
      #p-lista li { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; padding: 0.42em 0; border-bottom: 1.5px solid color-mix(in srgb, var(--linea-fuerte) 30%, transparent); font-family: "Titular", sans-serif; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
      #p-lista li .mono { font-size: 0.48em; color: var(--gris); }
      #p-lista li .ok { width: 0.62em; height: 0.62em; background: var(--colorAcento); color: var(--colorSobreAcento); display: grid; place-items: center; }
      #p-lista li .ok svg { width: 80%; height: 80%; }
      #p-lista .zona-tel { grid-column: 9 / 13; }

      /* ---------- 5. Antes / después: tabla comparativa ---------- */
      #p-antes .tabla { grid-column: 1 / 13; display: grid; grid-template-columns: 110px 1fr 1fr; align-content: start; font-size: 58px; min-height: 0; overflow: hidden; }
      #p-antes .tabla > * { padding: 0.5em 0.6em 0.5em 0; border-bottom: 1.5px solid color-mix(in srgb, var(--linea-fuerte) 30%, transparent); }
      #p-antes .tabla .enc { padding-bottom: 0.4em; border-bottom: 2.5px solid var(--linea-fuerte); font-family: "Mono", monospace; font-size: 22px; font-weight: 500; text-transform: uppercase; color: var(--gris); }
      #p-antes .tabla .enc.nuevo { color: var(--tinta); display: flex; align-items: center; gap: 12px; }
      #p-antes .tabla .enc.nuevo::before { content: ""; width: 16px; height: 16px; background: var(--colorAcento); }
      #p-antes .tabla .n { font-family: "Mono", monospace; font-size: 22px; color: var(--gris); padding-top: 0.95em; }
      #p-antes .tabla .viejo { font-family: "Titular", sans-serif; font-weight: 400; color: var(--gris); text-decoration: line-through; text-decoration-thickness: 2px; letter-spacing: -0.02em; }
      #p-antes .tabla .nuevo-celda { font-family: "Titular", sans-serif; font-weight: 600; letter-spacing: -0.025em; }
      #p-antes .titulo-tabla { grid-column: 1 / 13; font-size: 120px; margin-bottom: 40px; }
      #p-antes .cuerpo { grid-template-rows: auto 1fr; }

      /* ---------- Vertical ---------- */
      [data-formato="vertical"] .cuerpo { grid-template-columns: repeat(6, 1fr); }
      [data-formato="vertical"] .pieza::before { background: repeating-linear-gradient(to right, var(--linea) 0 1.5px, transparent 1.5px calc((100% - 1.5px) / 6)); }
      [data-formato="vertical"] .pie { flex-direction: column; align-items: flex-start; gap: 16px; }
      [data-formato="vertical"] .meta { max-width: 420px; font-size: 18px; }
      [data-formato="vertical"] #p-pregunta .texto { grid-column: 1 / -1; }
      [data-formato="vertical"] #p-pregunta .titulo { font-size: 150px; }
      [data-formato="vertical"] #p-pregunta .lado { grid-column: 3 / -1; }
      [data-formato="vertical"] #p-beneficio .cuerpo,
      [data-formato="vertical"] #p-numero .cuerpo,
      [data-formato="vertical"] #p-lista .cuerpo { grid-template-rows: auto 1fr; row-gap: 50px; }
      [data-formato="vertical"] #p-beneficio .texto,
      [data-formato="vertical"] #p-numero .texto,
      [data-formato="vertical"] #p-lista .texto { grid-column: 1 / -1; }
      [data-formato="vertical"] #p-beneficio .zona-tel,
      [data-formato="vertical"] #p-numero .zona-tel { grid-column: 1 / -1; justify-content: center; }
      [data-formato="vertical"] #p-lista .zona-tel { display: none; }
      [data-formato="vertical"] #p-lista .cuerpo { grid-template-rows: 1fr; }
      [data-formato="vertical"] #p-beneficio .titulo { font-size: 96px; }
      [data-formato="vertical"] #p-beneficio .nota { right: auto; left: 0; bottom: 10%; }
      [data-formato="vertical"] #p-beneficio .nota .linea { order: 2; }
      [data-formato="vertical"] #p-beneficio .nota .linea::after { right: -7px; }
      [data-formato="vertical"] #p-numero .valor { font-size: 250px; }
      [data-formato="vertical"] #p-lista .titulo { font-size: 110px; }
      [data-formato="vertical"] #p-lista ol { font-size: 56px; }
      [data-formato="vertical"] #p-antes .titulo-tabla { grid-column: 1 / -1; font-size: 120px; }
      [data-formato="vertical"] #p-antes .tabla { grid-column: 1 / -1; grid-template-columns: 70px 1fr; font-size: 64px; }
      [data-formato="vertical"] #p-antes .tabla .enc { display: none; }
      [data-formato="vertical"] #p-antes .tabla .n { grid-row: span 2; }
      [data-formato="vertical"] #p-antes .tabla .viejo { border-bottom: none; padding-bottom: 0; font-size: 0.7em; }

      /* ---------- 4:5 ---------- */
      [data-formato="4x5"] .logo { width: 290px; height: 62px; }
      [data-formato="4x5"] .mono, [data-formato="4x5"] .url { font-size: 16px; }
      [data-formato="4x5"] .meta { max-width: 470px; }
      [data-formato="4x5"] .cuerpo { padding: 34px 0; column-gap: 18px; }
      [data-formato="4x5"] .sub { font-size: 26px; }
      [data-formato="4x5"] .cta { height: 64px; font-size: 25px; padding: 0 26px 0 20px; }
      [data-formato="4x5"] .insignia, [data-formato="4x5"] .insignia-web { height: 54px; }
      [data-formato="4x5"] .insignia-web b { font-size: 22px; }
      [data-formato="4x5"] .nota strong { font-size: 36px; }
      [data-formato="4x5"] .nota .caja { padding: 12px 16px; }
      [data-formato="4x5"] .nota .linea { width: 60px; }
      [data-formato="4x5"] #p-pregunta .titulo { font-size: 120px; }
      [data-formato="4x5"] #p-pregunta .texto { grid-column: 1 / -1; }
      [data-formato="4x5"] #p-pregunta .lado { grid-column: 5 / 13; }
      [data-formato="4x5"] #p-beneficio .texto { grid-column: 1 / 8; gap: 20px; }
      [data-formato="4x5"] #p-beneficio .titulo { font-size: 70px; }
      [data-formato="4x5"] #p-beneficio .zona-tel { grid-column: 8 / 13; }
      [data-formato="4x5"] #p-beneficio .nota { right: auto; left: -140px; bottom: 6%; }
      [data-formato="4x5"] #p-numero .texto { grid-column: 1 / 8; }
      [data-formato="4x5"] #p-numero .valor { font-size: 190px; }
      [data-formato="4x5"] #p-numero .zona-tel { grid-column: 8 / 13; }
      [data-formato="4x5"] #p-lista .texto { grid-column: 1 / 9; gap: 26px; }
      [data-formato="4x5"] #p-lista .titulo { font-size: 68px; }
      [data-formato="4x5"] #p-lista ol { font-size: 34px; }
      [data-formato="4x5"] #p-lista .zona-tel { grid-column: 9 / 13; }
      [data-formato="4x5"] #p-antes .titulo-tabla { font-size: 84px; margin-bottom: 26px; }
      [data-formato="4x5"] #p-antes .tabla { grid-template-columns: 56px 1fr 1fr; font-size: 40px; }
      [data-formato="4x5"] #p-antes .tabla .enc, [data-formato="4x5"] #p-antes .tabla .n { font-size: 16px; }
    </style>
  </head>
  <body>
    <!-- Cada pieza ocupa 1 s de la línea de tiempo; el script saca una imagen de cada una -->
    <div id="root" data-formato="horizontal" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="p-pregunta" class="clip pieza" data-start="0" data-duration="1" data-track-index="0">
        <i class="registro ai"></i><i class="registro ad"></i>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /><span class="mono meta" data-meta="01"></span></header>
        <div class="cuerpo">
          <div class="texto"><h1 class="titulo" id="preguntaTitulo" data-ajustar data-caja=".texto"></h1></div>
          <div class="lado"><p class="sub" id="preguntaSub"></p></div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-beneficio" class="clip pieza" data-start="1" data-duration="1" data-track-index="0">
        <i class="registro ai"></i><i class="registro ad"></i>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /><span class="mono meta" data-meta="02"></span></header>
        <div class="cuerpo">
          <div class="texto">
            <span class="mono rotulo" id="beneficioKicker"></span>
            <h1 class="titulo" id="beneficioTitulo" data-ajustar data-caja=".texto"></h1>
            <p class="sub" id="beneficioSub"></p>
          </div>
          <div class="zona-tel">
            <div class="tel"><div class="pantalla"><img src="{{img:@beneficio}}" alt="" /></div></div>
            <div class="nota" id="beneficioNota"><div class="caja"></div><span class="linea"></span></div>
          </div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-numero" class="clip pieza tinta" data-start="2" data-duration="1" data-track-index="0">
        <i class="registro ai"></i><i class="registro ad"></i>
        <header class="cab"><img class="logo" src="{{img:logo}}" alt="" /><span class="mono meta" data-meta="03"></span></header>
        <div class="cuerpo">
          <div class="texto">
            <div class="cota mono"><i></i><b></b><span id="numeroEtiqueta"></span><b></b><i></i></div>
            <span class="valor" id="numeroValor" data-ajustar data-caja=".texto"></span>
            <p class="sub" id="numeroSub"></p>
          </div>
          <div class="zona-tel"><div class="tel"><div class="pantalla"><img src="{{img:@numero}}" alt="" /></div></div></div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-lista" class="clip pieza" data-start="3" data-duration="1" data-track-index="0">
        <i class="registro ai"></i><i class="registro ad"></i>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /><span class="mono meta" data-meta="04"></span></header>
        <div class="cuerpo">
          <div class="texto">
            <h1 class="titulo" id="listaTitulo" data-ajustar data-caja=".texto"></h1>
            <ol id="listaItems"></ol>
          </div>
          <div class="zona-tel"><div class="tel"><div class="pantalla"><img src="{{img:@lista}}" alt="" /></div></div></div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-antes" class="clip pieza" data-start="4" data-duration="1" data-track-index="0">
        <i class="registro ai"></i><i class="registro ad"></i>
        <header class="cab"><img class="logo" src="{{img:logoClaro}}" alt="" /><span class="mono meta" data-meta="05"></span></header>
        <div class="cuerpo">
          <h1 class="titulo titulo-tabla" id="antesTituloTabla"></h1>
          <div class="tabla" id="antesTabla" data-ajustar data-caja=".tabla"></div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>
    </div>

    <script>
      // El script anunciar.mjs reemplaza este objeto con los datos de la marca
      const D = "__DATOS__";
      armarPiezas(() => {
        const T = D.textos;
        const I = D.imagenes;
        document.querySelectorAll("[data-meta]").forEach((el) => (el.textContent = `N°${el.dataset.meta}${T.kicker ? " — " + T.kicker : ""}`));

        $("preguntaTitulo").innerHTML = resaltar(I.pregunta.titulo, I.pregunta.resaltado);
        $("preguntaSub").textContent = I.pregunta.subtitulo;

        const b = I.beneficio;
        $("beneficioKicker").textContent = b.kicker;
        $("beneficioTitulo").textContent = b.titulo;
        $("beneficioSub").textContent = b.subtitulo;
        if (b.tarjeta) $("beneficioNota").querySelector(".caja").innerHTML = `<small class="mono">${esc(b.tarjeta.etiqueta)}</small><strong>${esc(b.tarjeta.valor)}</strong>`;
        else $("beneficioNota").remove();

        $("numeroEtiqueta").textContent = I.numero.etiqueta;
        $("numeroValor").textContent = I.numero.valor;
        $("numeroSub").textContent = I.numero.subtitulo;

        $("listaTitulo").textContent = I.lista.titulo;
        $("listaItems").innerHTML = I.lista.items
          .map((t, i) => `<li><span class="mono">0${i + 1}</span><span>${esc(t)}</span><i class="ok">${ICONOS.check}</i></li>`)
          .join("");

        // tabla: una fila por par antes → después
        const a = I["antes-despues"];
        $("antesTituloTabla").textContent = a.despuesTitulo;
        const filas = Math.max(a.antes.length, a.despues.length);
        let html = `<span class="enc"></span><span class="enc">${esc(a.antesTitulo)}</span><span class="enc nuevo">${esc(a.despuesTitulo)}</span>`;
        for (let i = 0; i < filas; i++) {
          html += `<span class="n">0${i + 1}</span><span class="viejo">${esc(a.antes[i] || "")}</span><span class="nuevo-celda">${esc(a.despues[i] || "")}</span>`;
        }
        $("antesTabla").innerHTML = html;
      }).then(() => {
        window.__timelines["main"] = gsap.timeline({ paused: true });
      });
    </script>
  </body>
</html>
