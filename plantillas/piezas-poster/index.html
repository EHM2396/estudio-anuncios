<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/comun.js"></script>
    <style>
      /* Dirección póster: condensada enorme en mayúsculas, colores planos, sombras duras, cintas y stickers. */
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-500.ttf"); font-weight: 500; }
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-600.ttf"); font-weight: 600; }
      @font-face { font-family: "Marca"; src: url("assets/marca/fuente-700.ttf"); font-weight: 700; }
      @font-face { font-family: "Titular"; src: url("assets/fuentes/Anton-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Marca", sans-serif;
        --tinta: var(--colorFondo2);
        --pad-y: 80px;
        --pad-x: 96px;
        --pad-abajo: 80px;
        --borde: 6px;
        --duro: 16px;
      }
      #root[data-formato="vertical"] { --pad-y: 220px; --pad-x: 72px; --pad-abajo: 320px; }
      #root[data-formato="4x5"] { --pad-y: 64px; --pad-x: 64px; --pad-abajo: 64px; --borde: 5px; --duro: 12px; }

      /* ---------- Página: tres fondos que se turnan ---------- */
      .pieza {
        position: absolute;
        inset: 0;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: var(--pad-y) var(--pad-x) var(--pad-abajo);
        --fondo: var(--colorAcento);
        --texto: var(--colorSobreAcento);
        --sombra: var(--tinta);
        background: var(--fondo);
        color: var(--texto);
      }
      .pieza.clara { --fondo: color-mix(in srgb, var(--colorClaro) 60%, #fff); --texto: var(--tinta); }
      .pieza.tinta { --fondo: var(--tinta); --texto: #fff; --sombra: var(--colorAcento); }
      .cab { position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; }
      .chapa {
        display: inline-flex;
        padding: 14px 22px;
        background: #fff;
        border: var(--borde) solid var(--tinta);
        box-shadow: var(--duro) var(--duro) 0 var(--sombra);
      }
      .tinta .chapa { border-color: #fff; }
      .logo { display: block; width: 300px; height: 64px; object-fit: contain; object-position: left center; }
      .cuerpo { position: relative; z-index: 2; display: grid; min-height: 0; padding: 40px 0; }
      .texto { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
      .titulo {
        font-family: "Titular", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        line-height: 0.92;
        letter-spacing: 0.005em;
        text-wrap: balance;
      }
      /* el fondo solo cubre el alto de las mayúsculas: con interlineado apretado no tapa la línea vecina */
      .titulo .resaltado {
        background: linear-gradient(transparent 13%, var(--tinta) 13% 87%, transparent 87%);
        color: var(--colorAcento);
        padding: 0 0.1em;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      .tinta .titulo .resaltado { background: linear-gradient(transparent 13%, var(--colorAcento) 13% 87%, transparent 87%); color: var(--colorSobreAcento); }
      .sub { font-size: 36px; font-weight: 600; line-height: 1.3; text-wrap: pretty; max-width: 880px; }
      /* cinta: etiqueta o frase sobre una tira de color, un poco torcida */
      .cinta {
        align-self: flex-start;
        display: inline-block;
        padding: 12px 22px;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--tinta);
        color: #fff;
        transform: rotate(-2deg);
        box-shadow: calc(var(--duro) * 0.6) calc(var(--duro) * 0.6) 0 color-mix(in srgb, var(--tinta) 35%, transparent);
      }
      .tinta .cinta { background: var(--colorAcento); color: var(--colorSobreAcento); box-shadow: none; }
      .cinta.blanca { background: #fff; color: var(--tinta); font-weight: 600; text-transform: none; letter-spacing: 0; line-height: 1.3; max-width: 900px; transform: rotate(-1.2deg); box-shadow: var(--duro) var(--duro) 0 var(--tinta); }

      /* Teléfono gigante con sombra dura, cortado por el borde */
      .tel {
        position: absolute;
        aspect-ratio: var(--ar-tel, 0.58);
        z-index: 1;
        padding: 14px;
        border-radius: 70px;
        background: var(--tinta);
        border: var(--borde) solid var(--tinta);
        box-shadow: calc(var(--duro) * 1.5) calc(var(--duro) * 1.5) 0 var(--sombra);
      }
      .tinta .tel { background: #000; border-color: #fff; }
      .tel .pantalla { width: 100%; height: 100%; border-radius: 54px; overflow: hidden; background: #fff; }
      .tel img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
      .sticker {
        position: absolute;
        z-index: 3;
        display: flex;
        flex-direction: column;
        padding: 20px 30px;
        background: #fff;
        color: var(--tinta);
        border: var(--borde) solid var(--tinta);
        box-shadow: var(--duro) var(--duro) 0 var(--tinta);
        transform: rotate(4deg);
        white-space: nowrap;
      }
      .sticker small { font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      .sticker strong { font-family: "Titular", sans-serif; font-weight: 400; font-size: 64px; line-height: 1; text-transform: uppercase; }

      /* ---------- Pie ---------- */
      .pie { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
      .pie-fila { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        height: 88px;
        padding: 0 40px;
        font-size: 34px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        background: var(--tinta);
        color: #fff;
        border: var(--borde) solid var(--tinta);
        box-shadow: var(--duro) var(--duro) 0 #fff;
      }
      .clara .cta { box-shadow: var(--duro) var(--duro) 0 var(--colorAcento); }
      .tinta .cta { background: var(--colorAcento); color: var(--colorSobreAcento); border-color: var(--colorAcento); box-shadow: var(--duro) var(--duro) 0 #fff; }
      .cta svg { width: 32px; height: 32px; }
      .insignia { height: 70px; display: block; }
      .insignia-web { height: 70px; display: flex; align-items: center; gap: 12px; padding: 0 22px 0 16px; background: #000; color: #fff; border-radius: 10px; border: 1.5px solid #a6a6a6; }
      .insignia-web svg { width: 36px; height: 36px; }
      .insignia-web small { display: block; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.1; }
      .insignia-web b { display: block; font-size: 27px; font-weight: 600; line-height: 1.05; }
      .url { font-size: 26px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }

      /* ---------- 1. Pregunta: el titular llena el póster ---------- */
      #p-pregunta .titulo { font-size: 250px; }
      #p-pregunta .cinta.blanca { margin-top: 48px; font-size: 36px; }
      #p-pregunta .signo {
        position: absolute;
        right: -60px;
        bottom: -260px;
        z-index: 0;
        font-family: "Titular", sans-serif;
        font-size: 1400px;
        line-height: 1;
        color: transparent;
        -webkit-text-stroke: 6px color-mix(in srgb, var(--tinta) 22%, transparent);
        transform: rotate(10deg);
      }

      /* ---------- 2. Beneficio: teléfono gigante ---------- */
      #p-beneficio .texto { width: 900px; gap: 30px; }
      #p-beneficio .sub { max-width: 820px; }
      #p-beneficio .titulo { font-size: 150px; }
      #p-beneficio .tel { right: 170px; top: 120px; height: 1180px; transform: rotate(-7deg); }
      #p-beneficio .sticker { right: 640px; top: 640px; }

      /* ---------- 3. Número: cifra enorme sobre tinta ---------- */
      #p-numero .texto { width: 1100px; gap: 10px; }
      #p-numero .valor { font-family: "Titular", sans-serif; font-size: 400px; line-height: 0.95; color: var(--colorAcento); white-space: nowrap; margin-top: 20px; }
      #p-numero .sub { font-size: 40px; }
      #p-numero .tel { right: 120px; top: 170px; height: 1100px; transform: rotate(8deg); }

      /* ---------- 4. Lista: cintas apiladas ---------- */
      #p-lista .titulo { font-size: 170px; margin-bottom: 48px; }
      #p-lista ul { list-style: none; display: flex; flex-direction: column; gap: 24px; font-size: 60px; }
      #p-lista li {
        align-self: flex-start;
        display: flex;
        align-items: center;
        gap: 0.4em;
        padding: 0.18em 0.45em 0.16em 0.3em;
        font-family: "Titular", sans-serif;
        text-transform: uppercase;
        line-height: 1;
        background: var(--tinta);
        color: #fff;
      }
      #p-lista li:nth-child(1) { transform: rotate(-1.4deg); }
      #p-lista li:nth-child(2) { transform: rotate(0.8deg) translateX(40px); }
      #p-lista li:nth-child(3) { transform: rotate(-0.6deg) translateX(10px); }
      #p-lista li i { font-style: normal; color: var(--colorAcento); }
      #p-lista .marca-agua {
        position: absolute;
        right: -40px;
        top: 50%;
        transform: translateY(-50%) rotate(-90deg);
        transform-origin: center;
        font-family: "Titular", sans-serif;
        font-size: 300px;
        line-height: 1;
        text-transform: uppercase;
        white-space: nowrap;
        color: transparent;
        -webkit-text-stroke: 5px color-mix(in srgb, var(--tinta) 25%, transparent);
      }

      /* ---------- 5. Antes / después: corte en diagonal ---------- */
      #p-antes { padding: 0; display: block; background: #e6e3dc; }
      #p-antes .lado { position: absolute; display: flex; flex-direction: column; gap: 34px; }
      #p-antes .antes { left: 0; top: 0; bottom: 0; width: 50%; padding: var(--pad-y) 120px var(--pad-abajo) var(--pad-x); justify-content: center; color: #6e6a62; }
      #p-antes .despues {
        right: 0;
        top: 0;
        bottom: 0;
        width: 58%;
        padding: var(--pad-y) var(--pad-x) var(--pad-abajo) 200px;
        background: var(--colorAcento);
        color: var(--colorSobreAcento);
        clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%);
      }
      #p-antes .grande { font-family: "Titular", sans-serif; font-size: 150px; line-height: 0.9; text-transform: uppercase; }
      #p-antes .antes .grande { color: transparent; -webkit-text-stroke: 4px #8d877c; }
      #p-antes ul { list-style: none; display: flex; flex-direction: column; gap: 22px; }
      #p-antes .antes .grande { font-size: 190px; }
      #p-antes .antes li { position: relative; align-self: flex-start; font-size: 46px; font-weight: 600; }
      #p-antes .antes li::after { content: ""; position: absolute; left: -8px; right: -8px; top: 52%; height: 7px; background: var(--tinta); transform: rotate(-2deg); }
      #p-antes .despues ul { font-size: 48px; }
      #p-antes .despues li { display: flex; align-items: center; gap: 18px; font-weight: 700; line-height: 1.1; }
      #p-antes .despues li i { width: 1.1em; height: 1.1em; flex: none; display: grid; place-items: center; background: var(--tinta); color: #fff; }
      #p-antes .despues li i svg { width: 70%; height: 70%; }
      #p-antes .despues .cuerpo-lado { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; min-height: 0; overflow: hidden; }

      /* ---------- Vertical ---------- */
      [data-formato="vertical"] .pie-fila { gap: 16px; }
      [data-formato="vertical"] #p-pregunta .titulo { font-size: 200px; }
      [data-formato="vertical"] #p-pregunta .signo { font-size: 1200px; right: -200px; bottom: -40px; }
      /* vertical con teléfono: texto y botón arriba, el teléfono ocupa la parte de abajo (y se mete en la zona de la interfaz) */
      [data-formato="vertical"] #p-beneficio,
      [data-formato="vertical"] #p-numero { grid-template-rows: auto minmax(0, 600px) auto 1fr; }
      [data-formato="vertical"] #p-beneficio .texto,
      [data-formato="vertical"] #p-numero .texto { width: auto; justify-content: flex-start; }
      [data-formato="vertical"] #p-beneficio .titulo { font-size: 140px; }
      [data-formato="vertical"] #p-beneficio .tel { right: auto; left: 230px; top: 1120px; height: 1220px; transform: rotate(-6deg); }
      [data-formato="vertical"] #p-beneficio .sticker { right: auto; left: 50px; top: 1430px; }
      [data-formato="vertical"] #p-numero .valor { font-size: 300px; }
      [data-formato="vertical"] #p-numero .tel { right: 40px; top: 1120px; height: 1100px; }
      [data-formato="vertical"] #p-lista .titulo { font-size: 150px; }
      [data-formato="vertical"] #p-lista ul { font-size: 56px; }
      [data-formato="vertical"] #p-antes .antes { width: auto; right: 0; bottom: auto; height: 46%; padding: var(--pad-y) var(--pad-x) 60px; }
      [data-formato="vertical"] #p-antes .despues { width: auto; left: 0; top: auto; height: 60%; padding: 180px var(--pad-x) var(--pad-abajo); clip-path: polygon(0 12%, 100% 0, 100% 100%, 0 100%); }
      [data-formato="vertical"] #p-antes .grande { font-size: 130px; }
      [data-formato="vertical"] #p-antes .antes .grande { font-size: 150px; }
      [data-formato="vertical"] #p-antes .antes li { font-size: 44px; }

      /* ---------- 4:5 ---------- */
      [data-formato="4x5"] .logo { width: 220px; height: 46px; }
      [data-formato="4x5"] .chapa { padding: 10px 18px; }
      [data-formato="4x5"] .cuerpo { padding: 30px 0; }
      [data-formato="4x5"] .sub { font-size: 29px; }
      [data-formato="4x5"] .cinta { font-size: 24px; }
      [data-formato="4x5"] .cta { height: 70px; padding: 0 30px; font-size: 27px; }
      [data-formato="4x5"] .insignia, [data-formato="4x5"] .insignia-web { height: 58px; }
      [data-formato="4x5"] .insignia-web b { font-size: 22px; }
      [data-formato="4x5"] .url { font-size: 21px; }
      [data-formato="4x5"] .pie { gap: 14px; }
      [data-formato="4x5"] .sticker strong { font-size: 48px; }
      [data-formato="4x5"] .sticker small { font-size: 18px; }
      [data-formato="4x5"] #p-pregunta .titulo { font-size: 170px; }
      [data-formato="4x5"] #p-pregunta .cinta.blanca { font-size: 28px; margin-top: 34px; }
      [data-formato="4x5"] #p-pregunta .signo { font-size: 1000px; bottom: -200px; }
      [data-formato="4x5"] #p-beneficio .texto { width: 560px; justify-content: flex-start; gap: 22px; }
      [data-formato="4x5"] #p-beneficio .titulo { font-size: 104px; }
      [data-formato="4x5"] #p-beneficio .sub { max-width: 520px; }
      [data-formato="4x5"] #p-beneficio .tel { right: -90px; top: 600px; height: 830px; }
      [data-formato="4x5"] #p-beneficio .sticker { right: 300px; top: 860px; }
      [data-formato="4x5"] #p-numero .texto { width: auto; justify-content: flex-start; }
      [data-formato="4x5"] #p-numero .valor { font-size: 250px; }
      [data-formato="4x5"] #p-numero .sub { font-size: 30px; max-width: 560px; }
      [data-formato="4x5"] #p-numero .tel { right: -70px; top: 640px; height: 790px; }
      [data-formato="4x5"] #p-lista .titulo { font-size: 116px; margin-bottom: 34px; }
      [data-formato="4x5"] #p-lista ul { font-size: 44px; gap: 18px; }
      [data-formato="4x5"] #p-lista .marca-agua { font-size: 220px; }
      [data-formato="4x5"] #p-antes .antes { width: auto; right: 0; bottom: auto; height: 44%; padding: var(--pad-y) var(--pad-x) 40px; gap: 20px; }
      [data-formato="4x5"] #p-antes .despues { width: auto; left: 0; top: auto; height: 62%; padding: 120px var(--pad-x) var(--pad-abajo); gap: 20px; clip-path: polygon(0 12%, 100% 0, 100% 100%, 0 100%); }
      [data-formato="4x5"] #p-antes .grande { font-size: 96px; }
      [data-formato="4x5"] #p-antes .antes .grande { font-size: 110px; }
      [data-formato="4x5"] #p-antes .antes li { font-size: 34px; }
      [data-formato="4x5"] #p-antes .despues ul { font-size: 36px; }
      [data-formato="4x5"] #p-antes ul { gap: 14px; }
    </style>
  </head>
  <body>
    <!-- Cada pieza ocupa 1 s de la línea de tiempo; el script saca una imagen de cada una -->
    <div id="root" data-formato="horizontal" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="p-pregunta" class="clip pieza" data-start="0" data-duration="1" data-track-index="0">
        <span class="signo" id="preguntaSigno"></span>
        <header class="cab"><span class="chapa"><img class="logo" src="{{img:logoClaro}}" alt="" /></span></header>
        <div class="cuerpo">
          <div class="texto">
            <h1 class="titulo" id="preguntaTitulo" data-ajustar data-caja=".texto"></h1>
            <p class="cinta blanca" id="preguntaSub"></p>
          </div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-beneficio" class="clip pieza clara" data-start="1" data-duration="1" data-track-index="0">
        <div class="tel"><div class="pantalla"><img src="{{img:@beneficio}}" alt="" /></div></div>
        <div class="sticker" id="beneficioSticker"></div>
        <header class="cab"><span class="chapa"><img class="logo" src="{{img:logoClaro}}" alt="" /></span></header>
        <div class="cuerpo">
          <div class="texto">
            <span class="cinta" id="beneficioKicker"></span>
            <h1 class="titulo" id="beneficioTitulo" data-ajustar data-caja=".texto"></h1>
            <p class="sub" id="beneficioSub"></p>
          </div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-numero" class="clip pieza tinta" data-start="2" data-duration="1" data-track-index="0">
        <div class="tel"><div class="pantalla"><img src="{{img:@numero}}" alt="" /></div></div>
        <header class="cab"><span class="chapa"><img class="logo" src="{{img:logoClaro}}" alt="" /></span></header>
        <div class="cuerpo">
          <div class="texto">
            <span class="cinta" id="numeroEtiqueta"></span>
            <span class="valor" id="numeroValor" data-ajustar data-caja=".texto"></span>
            <p class="sub" id="numeroSub"></p>
          </div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-lista" class="clip pieza" data-start="3" data-duration="1" data-track-index="0">
        <span class="marca-agua" id="listaMarcaAgua"></span>
        <header class="cab"><span class="chapa"><img class="logo" src="{{img:logoClaro}}" alt="" /></span></header>
        <div class="cuerpo">
          <div class="texto">
            <h1 class="titulo" id="listaTitulo" data-ajustar data-caja=".texto"></h1>
            <ul id="listaItems"></ul>
          </div>
        </div>
        <footer class="pie" data-pie></footer>
      </section>

      <section id="p-antes" class="clip pieza" data-start="4" data-duration="1" data-track-index="0">
        <div class="lado antes">
          <span class="grande" id="antesTitulo"></span>
          <ul id="antesItems"></ul>
        </div>
        <div class="lado despues">
          <header class="cab"><span class="chapa"><img class="logo" src="{{img:logoClaro}}" alt="" /></span></header>
          <div class="cuerpo-lado">
            <span class="grande" id="despuesTitulo" data-ajustar data-caja=".cuerpo-lado"></span>
            <ul id="despuesItems"></ul>
          </div>
          <footer class="pie" data-pie></footer>
        </div>
      </section>
    </div>

    <script>
      // El script anunciar.mjs reemplaza este objeto con los datos de la marca
      const D = "__DATOS__";
      armarPiezas(() => {
        const T = D.textos;
        const I = D.imagenes;

        $("preguntaTitulo").innerHTML = resaltar(I.pregunta.titulo, I.pregunta.resaltado);
        $("preguntaSub").textContent = I.pregunta.subtitulo;
        // el signo gigante de fondo solo si el titular es una pregunta o una exclamación
        $("preguntaSigno").textContent = I.pregunta.titulo.includes("?") ? "?" : I.pregunta.titulo.includes("!") ? "!" : "";

        const b = I.beneficio;
        $("beneficioKicker").textContent = b.kicker;
        $("beneficioTitulo").textContent = b.titulo;
        $("beneficioSub").textContent = b.subtitulo;
        $("beneficioSticker").innerHTML = b.tarjeta ? `<small>${esc(b.tarjeta.etiqueta)}</small><strong>${esc(b.tarjeta.valor)}</strong>` : "";
        if (!b.tarjeta) $("beneficioSticker").remove();

        $("numeroEtiqueta").textContent = I.numero.etiqueta;
        $("numeroValor").textContent = I.numero.valor;
        $("numeroSub").textContent = I.numero.subtitulo;

        $("listaTitulo").textContent = I.lista.titulo;
        $("listaItems").innerHTML = I.lista.items.map((t, i) => `<li><i>0${i + 1}</i>${esc(t)}</li>`).join("");
        $("listaMarcaAgua").textContent = T.nombre;

        const a = I["antes-despues"];
        $("antesTitulo").textContent = a.antesTitulo;
        $("despuesTitulo").textContent = a.despuesTitulo;
        $("antesItems").innerHTML = a.antes.map((t) => `<li>${esc(t)}</li>`).join("");
        $("despuesItems").innerHTML = a.despues.map((t) => `<li><i>${ICONOS.check}</i>${esc(t)}</li>`).join("");
      }).then(() => {
        window.__timelines["main"] = gsap.timeline({ paused: true });
      });
    </script>
  </body>
</html>
